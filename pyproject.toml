[project]
name = "llm-history-converter"
version = "0.1.0"
description = "Converte exports de conversas do Claude e do ChatGPT em arquivos de texto"
requires-python = ">=3.12"

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]